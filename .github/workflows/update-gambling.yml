name: Update Gambling Blocklist

on:
  schedule:
    - cron: '0 2 * * 1'   # Mỗi thứ Hai lúc 2:00 UTC (9:00 UTC+7)
  workflow_dispatch:        # Cho phép chạy thủ công trên GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch external gambling blocklists
        run: |
          mkdir -p tmp

          echo "Fetching HaGeZi gambling list..."
          curl -sSf "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/gambling.txt" \
            -o tmp/hagezi_gambling.txt || echo "HaGeZi fetch failed, skipping"

          echo "Fetching StevenBlack gambling-only hosts..."
          curl -sSf "https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/gambling-only/hosts" \
            -o tmp/stevenblack_gambling.txt || echo "StevenBlack fetch failed, skipping"

          echo "Fetching BlockListProject gambling..."
          curl -sSf "https://blocklistproject.github.io/Lists/adguard/gambling-ags.txt" \
            -o tmp/blp_gambling.txt || echo "BlockListProject fetch failed, skipping"

      - name: Process and merge blocklists
        run: |
          python3 - <<'EOF'
          import re
          import os

          WHITE_LIST_PATH = "filter/src/White_list.txt"
          OUTPUT_PATH     = "filter/src/gambling_auto.txt"

          # Đọc whitelist để loại bỏ domain đã được whitelist
          whitelisted = set()
          if os.path.exists(WHITE_LIST_PATH):
              for line in open(WHITE_LIST_PATH, encoding="utf-8"):
                  m = re.match(r"@@\|\|([^/^]+)\^", line.strip())
                  if m:
                      whitelisted.add(m.group(1).lower().lstrip("www."))

          # Parse domain từ nhiều format
          def extract_domain(line):
              line = line.strip()
              if not line or line.startswith("!") or line.startswith("#"):
                  return None
              # AdBlock format: ||domain.com^
              m = re.match(r"^\|\|([a-zA-Z0-9._*-]+)\^", line)
              if m:
                  return m.group(1).lower()
              # Hosts format: 0.0.0.0 domain.com
              m = re.match(r"^(?:0\.0\.0\.0|127\.0\.0\.1)\s+([a-zA-Z0-9._-]+)", line)
              if m:
                  d = m.group(1).lower()
                  if d not in ("localhost", "0.0.0.0", "broadcasthost"):
                      return d
              return None

          # Từ khóa liên quan gambling/cờ bạc để lọc từ nguồn tổng hợp
          GAMBLING_KEYWORDS = [
              "bet", "casino", "poker", "slot", "baccarat", "lottery",
              "lotto", "jackpot", "spin", "gambl", "wager", "sportsbook",
              # VN brands phổ biến
              "sunwin", "go88", "789bet", "jun88", "hi88", "kubet",
              "w88", "fb88", "new88", "shbet", "78win", "fun88",
              "188bet", "12bet", "88bet", "i9bet", "f8bet", "m88",
              "vwin", "k8cc", "typhu", "bk8", "dafabet",
          ]

          def is_gambling(domain):
              d = domain.lower()
              return any(kw in d for kw in GAMBLING_KEYWORDS)

          domains = set()

          for fname in ["tmp/hagezi_gambling.txt", "tmp/stevenblack_gambling.txt", "tmp/blp_gambling.txt"]:
              if not os.path.exists(fname):
                  continue
              count = 0
              for line in open(fname, encoding="utf-8", errors="ignore"):
                  domain = extract_domain(line)
                  if not domain:
                      continue
                  # HaGeZi đã lọc sẵn → giữ tất cả; nguồn khác lọc theo keyword
                  if "hagezi" in fname or is_gambling(domain):
                      base = domain.lstrip("www.")
                      if base not in whitelisted and domain not in whitelisted:
                          domains.add(domain)
                          count += 1
              print(f"  {fname}: {count} domains")

          # Loại bỏ subdomain nếu đã có parent domain
          # Ví dụ: sub.bet.com bị bỏ nếu đã có bet.com
          def has_parent(domain, domain_set):
              parts = domain.split(".")
              for i in range(1, len(parts) - 1):
                  parent = ".".join(parts[i:])
                  if parent in domain_set:
                      return True
              return False

          filtered = sorted(d for d in domains if not has_parent(d, domains))

          # Viết output dạng AdBlock ||domain^
          with open(OUTPUT_PATH, "w", encoding="utf-8") as f:
              f.write(f"! === Auto-generated gambling blocklist ({len(filtered)} domains) ===\n")
              f.write("! Sources: HaGeZi, StevenBlack, BlockListProject\n")
              f.write("! DO NOT edit manually — regenerated by GitHub Actions every Monday\n")
              f.write("!\n")
              for domain in filtered:
                  f.write(f"||{domain}^\n")

          print(f"Total unique domains: {len(filtered)}")
          EOF

      - name: Build combined hosts file
        run: |
          cd filter
          VERSION=$(date +'%Y%m%d%H%M%S%3N')
          TIME_STAMP=$(date +'%d %b %Y %H:%M:%S')

          # Header
          sed -e "s/_time_stamp_/$TIME_STAMP/g" -e "s/_version_/$VERSION/g" \
            src/Black_title.txt > combined.tmp

          # Manual rules
          cat src/Black_list.txt >> combined.tmp

          # Auto-generated gambling rules
          echo "" >> combined.tmp
          echo "! === Gambling domains (auto-updated) ===" >> combined.tmp
          cat src/gambling_auto.txt >> combined.tmp

          # Whitelist
          cat src/White_list.txt >> combined.tmp

          # Output
          cp combined.tmp ../hosts
          rm -f combined.tmp

          echo "hosts file: $(wc -l < ../hosts) lines"

      - name: Update version file
        run: date +'%s%3N' > version

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add filter/src/gambling_auto.txt hosts version

          # Chỉ commit nếu có thay đổi thực sự
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            DOMAIN_COUNT=$(grep -c "^||" filter/src/gambling_auto.txt || echo 0)
            git commit -m "chore: auto-update gambling blocklist ($DOMAIN_COUNT domains) [skip ci]"
            git push
          fi
